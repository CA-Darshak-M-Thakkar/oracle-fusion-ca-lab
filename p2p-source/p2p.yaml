# SINGLE SOURCE OF TRUTH for the P2P walk-through (EBS R12 screens from the Raju Chinthapatla manual + Fusion Cloud counterparts).
# Coordinates are in pixels of the manual's screenshot (ref file), origin top-left of the image incl. the 6px green frame.
# Element grammar (arrays):
#  ["t", x, yCentre, text, flags]            flags: r=right edge at x, c=centre at x, b=bold, g=grey, w=white, m=mono, k=black-link underline
#  ["f", x, y, w, h, value, flags]           y=required(yellow) r=read-only h=bright-yellow s=selected-text R=right-align l=LOV(...) p=dropdown w=white
#  ["b", x, y, w, h, text, flags]            d=disabled D=default-button
#  ["tabs", y, h, [[label,x,w],...], active, [disabledIdx...]]
#  ["panel", x, y, w, h]   ["grp", x, y, w, h, legend]   ["rect", x, y, w, h, fill, border, radius]
#  ["grid", y0, rowH, nRows, cols[[hdr,x,w,style]], rows[[..]], opts{hy,hdrBox,hh,mark,chk,sel,lastCol}]
#  ["radio", x, y, text, checked, disabled]  ["chk", x, y, text, checked, disabled]
#  ["vscroll", x, y, h]  ["hscroll", x, y, w]  ["ico", x, y, kind]  ["pre", x, y, w, text]
# Strings may hold {{key}} placeholders (data.yaml). "base:" copies another screen; "sub:" [[old,new]] replaces strings; "add:" appends elements.
