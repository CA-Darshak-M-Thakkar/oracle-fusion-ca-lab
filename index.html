<!doctype html>
<html lang="en" class="dark-theme" data-font="125">
  <head>
    <script>
      try {
        if (localStorage.getItem('oracle_fusion_theme') === 'light') {
          document.documentElement.classList.remove('dark-theme');
          document.documentElement.classList.add('light-theme');
        }
        var font = localStorage.getItem('oracle_fusion_font') || '125';
        document.documentElement.setAttribute('data-font', font);
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oracle Applications Cloud — Fusion ERP Teaching Simulator (CA / AICITSS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
